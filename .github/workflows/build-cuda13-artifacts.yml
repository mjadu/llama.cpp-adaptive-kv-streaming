name: Build CUDA 13 (Artifacts)

on:
  workflow_dispatch:
    inputs:
      cuda_version:
        description: 'CUDA version'
        required: true
        default: '13.3'
        type: string
      arch:
        description: 'CUDA architecture (e.g. 120 for RTX 50-series)'
        required: true
        default: '120'
        type: string

env:
  GGML_NLOOP: 3
  GGML_N_THREADS: 1

jobs:
  cuda-windows:
    runs-on: windows-2022

    permissions:
      actions: write

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install Cuda Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ inputs.cuda_version }}

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_ALL_QUANTS=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=${{ inputs.arch }} ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Upload llama-server
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-cuda13-win64
          path: build/bin/Release/llama-server.exe
          if-no-files-found: error

      - name: Upload llama-cli
        uses: actions/upload-artifact@v4
        with:
          name: llama-cli-cuda13-win64
          path: build/bin/Release/llama-cli.exe
          if-no-files-found: error

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-cuda13-win64
          path: build/bin/Release/*.exe
          if-no-files-found: error
